# ============================================================================
#  ШАБЛОН. Скопируйте содержимое этого файла в .github/workflows/update.yml
#  (целиком, заменив старое) и закоммитьте. У бота, который правит репозиторий
#  автоматически, нет права менять workflow-файлы, поэтому это делается руками.
#
#  Что изменилось по сравнению со старой версией:
#   1. Окно сбора: было `--days=-1..3` — только четыре дня. Стало две недели
#      (текущая и следующая), иначе обзор недели наполовину пустой.
#   2. Воркеров 4 -> 6: страниц стало больше, а сайт техникума их держит.
#   3. Коммитятся только данные, и только когда они правда изменились.
#   4. Добавлен шаг с тестами: если парсер сломался об изменившуюся вёрстку
#      almetpt.ru, лучше увидеть красный крестик, чем молча залить мусор.
# ============================================================================

name: Обновление расписания (бот)

on:
  # Каждые 10 минут. Расписание на завтра обычно появляется в 12–14 МСК,
  # поэтому задержка между публикацией на almetpt.ru и зеркалом должна быть
  # короткой даже с учётом очереди GitHub Actions.
  schedule:
    - cron: "2,12,22,32,42,52 * * * *"

  # Ручной запуск из вкладки Actions
  workflow_dispatch: {}

  # При изменении кода — пересобрать сразу, не дожидаясь cron
  push:
    paths:
      - "fetch_all.py"
      - "parser.py"
      - "static/**"

permissions:
  contents: write          # нужно, чтобы коммитить данные в репозиторий

concurrency:
  group: schedule-bot
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest        # Python 3.12 уже стоит в образе раннера
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # Быстрая проверка парсера на сохранённых страницах almetpt.ru.
      # Секунды времени, зато ловит поломку вёрстки до записи данных.
      - name: Тесты
        run: python3 -m unittest discover -s tests -q

      - name: Собрать расписание
        run: |
          python3 --version
          python3 fetch_all.py --weeks 2 --workers 6

      - name: Закоммитить изменения
        run: |
          git config user.name  "apt-schedule-bot"
          git config user.email "apt-schedule-bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Изменений нет — коммит не нужен"
            exit 0
          fi
          git commit -m "data: обновление расписания $(date -u +'%Y-%m-%d %H:%M') UTC"
          # данные мог успеть обновить параллельный прогон — подтягиваем и дожимаем
          for i in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" && \
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            echo "Попытка $i не прошла, повторяю…"
            sleep 5
          done
          echo "Не удалось запушить изменения" >&2
          exit 1

# ----------------------------------------------------------------------------
#  Полезно знать
#
#  * Сколько это стоит. Полный холодный прогон (82 группы x 14 дней) занимает
#    около 3 минут, обычный — 30-60 секунд: бот перезапрашивает только то,
#    у чего истёк TTL. Для публичного репозитория минуты Actions бесплатны.
#
#  * Почему не чаще 10 минут. Расписание на день правят редко, но публикация
#    расписания на завтра обычно приходится на 12–14 МСК; короткий интервал
#    уменьшает время до появления данных в зеркале.
#
#  * Разовая полная пересборка, если что-то пошло не так:
#      Actions -> Обновление расписания (бот) -> Run workflow
#    а в шаге «Собрать расписание» временно поставить
#      python3 fetch_all.py --full --weeks 2 --workers 6
#
#  * Если almetpt.ru недоступен, бот оставляет старые данные и не ломает
#    зеркало, а на сайте появляется баннер «зеркало давно не обновлялось».
# ----------------------------------------------------------------------------
